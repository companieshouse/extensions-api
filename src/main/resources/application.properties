server.port=${EXTENSIONS_API_PORT:4056}
spring.mongodb.uri=${EXTENSIONS_API_MONGODB_URL}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE}

######### Health check #########
management.endpoints.access.default=read_only
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=/extensions-api/healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
internal.api.key=${CHS_INTERNAL_API_KEY}
file.transfer.api.url=${FILE_TRANSFER_API_URL}

# OpenTelemetry configuration
management.opentelemetry.enabled=${OTEL_LOG_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
