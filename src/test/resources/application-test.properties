spring.mongodb.uri=mongodb://localhost/extension_requests
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

management.opentelemetry.enabled=false
management.opentelemetry.logging.export.otlp.endpoint=http://localhost/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost/v1/traces
management.otlp.metrics.export.url=http://localhost/v1/metrics

internal.api.key=CHS_INTERNAL_API_KEY
file.transfer.api.url=FILE_TRANSFER_API_URL
